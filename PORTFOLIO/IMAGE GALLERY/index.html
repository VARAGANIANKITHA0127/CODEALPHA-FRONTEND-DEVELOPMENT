<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Image Gallery</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <h1>My Image Gallery</h1>

    <div class="gallery">

        <div class="image-card">
            <img src="https://picsum.photos/id/1015/400/300"
                 onclick="openLightbox(0)">
        </div>

        <div class="image-card">
            <img src="https://picsum.photos/id/1016/400/300"
                 onclick="openLightbox(1)">
        </div>

        <div class="image-card">
            <img src="https://picsum.photos/id/1025/400/300"
                 onclick="openLightbox(2)">
        </div>

        <div class="image-card">
            <img src="https://picsum.photos/id/1035/400/300"
                 onclick="openLightbox(3)">
        </div>

        <div class="image-card">
            <img src="https://picsum.photos/id/1043/400/300"
                 onclick="openLightbox(4)">
        </div>

        <div class="image-card">
            <img src="https://picsum.photos/id/1069/400/300"
                 onclick="openLightbox(5)">
        </div>

    </div>


    <!-- Lightbox -->

    <div id="lightbox" class="lightbox">

        <span class="close" onclick="closeLightbox()">
            &times;
        </span>

        <button class="prev" onclick="previousImage()">
            &#10094;
        </button>

        <img id="lightboxImage">

        <button class="next" onclick="nextImage()">
            &#10095;
        </button>

    </div>


    <script src="script.js"></script>

</body>

</html>
